[project]
name = "garmin2intervals"
version = "0.1.0"
description = "Syncs Garmin Connect activities (including child/family accounts) to intervals.icu"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "garminconnect>=0.3.17",
  "requests",
  "python-dotenv",
]

[project.scripts]
garmin2intervals-smoke-test = "garmin2intervals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["garmin2intervals"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
cache_dir = ".pyc/pytest_cache"
